versioning:
  scheme: url-path
  current: v1
  statement: The version is in the URL path. Every endpoint lives under /v1/, and there is no version header or query parameter to set.
  additive_inside_version:
  - new endpoints
  - new optional request fields
  - new fields in a response body
  never_inside_version:
  - the meaning or type of an existing field
  - an existing field becoming required, or disappearing
  - an error code string for a given failure
  - the path of an existing endpoint
  client_obligation: ignore response fields you do not recognize
  docs: https://cloro.dev/docs/guides/versioning
deprecation:
  policy: A deprecated endpoint announces itself in its own responses with Deprecation (RFC 9745), Sunset (RFC 8594) and Link rel="deprecation" headers; a change of meaning gets a new version path (/v2/) and existing paths are not repurposed.
  minimum_notice: a minimum of six months between the Deprecation date and the Sunset date on any generally available endpoint
  headers:
  - Deprecation
  - Sunset
  - Link; rel="deprecation"
  rfc: [RFC 9745, RFC 8594]
  currently_deprecated: Nothing is deprecated today, so no live endpoint carries these headers.
  docs: https://cloro.dev/docs/guides/versioning
