overlay: 1.0.0
info:
  title: API Evangelist overlay for the cloro API
  version: '2026-10-07'
  description: 'Enhancements layered over openapi/cloro-dev-openapi.yml by API Evangelist: tags per operation group (the source has none), the documented rate-limit and credit headers on monitor responses, the status page and changelog as external docs, and links to the sibling artifacts. The original contract is never mutated.'
