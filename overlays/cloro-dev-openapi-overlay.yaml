x-method: generated
actions:
- target: $.info
  update:
    x-apievangelist:
      profile: https://apis.io/providers/cloro-dev
      artifacts:
        conventions: conventions/cloro-dev-conventions.yml
        rate-limits: rate-limits/cloro-dev-rate-limits.yml
        errors: errors/cloro-dev-problem-types.yml
        webhooks: asyncapi/cloro-dev-webhooks.yml
        mcp: mcp/cloro-dev-mcp.yml
        lifecycle: lifecycle/cloro-dev-lifecycle.yml
- target: $
  update:
    externalDocs:
      description: cloro changelog
      url: https://cloro.dev/docs/changelog
    tags:
    - name: Monitor
      description: Synchronous AI-answer and search extraction endpoints under /v1/monitor
    - name: Async
      description: 'Background task queue: submit, batch, status, clear'
    - name: Utility
      description: Countries, states and credit balance
