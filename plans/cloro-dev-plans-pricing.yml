note: 'Credit-based monthly subscription: "cloro uses a credit-based subscription model, so there is no pay-as-you-go or per-request pricing." Credits do not roll over; standard and self-serve Enterprise tiers have a hard credit cap with no overages; annual Enterprise contracts add overages, 20% more credits and 1.3x concurrency. price_text for Free/Lite/Hobby/Starter is the plan card; Growth through Enterprise 5K come from the "Compare all 11 tiers" table where price, credits, per-1k rate and concurrency are bare cells. Per-request credit costs (async/batch; sync adds +2): ChatGPT (full response) 7 credits, ChatGPT (web search) 5 credits, Perplexity 4 credits, Grok 4 credits (unavailable), Copilot 5 credits, AI Mode 4 credits, AI Overview (incl. SERP) 5 credits, Gemini 4 credits, Google Search 3 credits +2/page, Google News 3 credits +2/page.'
