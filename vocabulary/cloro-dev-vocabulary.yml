  - term: GlParameter
    definition: Alternative to `country`, using Google's own parameter name for the result geography. Same ISO 3166-1 alpha-2 codes, accepted
      in either case (`us` or `US`), and must be a country the endpoint supports — see `GET /v1/countries`. Provide `country` or `gl`; sending
      both with different values is a `400`.
    tags:
    - Object
    source: openapi/cloro-dev-openapi.yml#/components/schemas/GlParameter
  - term: HlParameter
    definition: Interface language, as Google's own `hl` parameter (e.g. `en`, `de`, `pt-BR`). Free-form and case-insensitive — Google owns the
      list of codes. Overrides the language cloro derives from the country, so the interface language and the result geography can differ.
    tags:
    - Object
    source: openapi/cloro-dev-openapi.yml#/components/schemas/HlParameter
