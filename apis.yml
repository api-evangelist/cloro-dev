apis:
- name: cloro MCP server
  description: >-
    Hosted Model Context Protocol server (Streamable HTTP) wrapping the sync monitor endpoints of api.cloro.dev
    as ten tools: scrape_chatgpt, scrape_gemini, scrape_copilot, scrape_perplexity, scrape_grok, scrape_google_ai_mode,
    scrape_google, scrape_google_news, list_countries and list_states. initialize and tools/list answer
    anonymously; tools/call needs a cloro API key (bearer or in the URL path) or an OAuth token from clerk.cloro.dev,
    advertised through /.well-known/oauth-protected-resource. The same server runs locally over stdio
    from the open-source cloro-dev/mcp-server repository.
  humanURL: https://cloro.dev/docs/integrations/mcp
  baseURL: https://mcp.cloro.dev/mcp
  tags:
  - MCP
  - AI
  - Agents
