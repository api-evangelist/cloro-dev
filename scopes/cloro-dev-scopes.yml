  token_endpoint: https://clerk.cloro.dev/oauth/token
  revocation_endpoint: https://clerk.cloro.dev/oauth/token/revoke
  device_authorization_endpoint: https://clerk.cloro.dev/oauth/device_authorization
  jwks_uri: https://clerk.cloro.dev/.well-known/jwks.json
  grant_types_supported: [authorization_code, refresh_token, 'urn:ietf:params:oauth:grant-type:device_code']
