- name: list_countries
  title: List supported countries
  description: List the ISO 3166-1 alpha-2 country codes supported for geo-targeting. Pass a model to get the codes available for that specific engine (some engines block certain countries).
  inputSchema:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    properties:
      model:
        description: Optionally filter to countries supported by a specific engine.
        type: string
        enum:
        - aimode
        - aioverview
        - chatgpt
        - copilot
        - gemini
        - google
        - grok
        - perplexity
  rest:
    operationId: getCountries
    method: GET
    path: /v1/countries
- name: list_states
  title: List states for a country
  description: List the state codes available for state-level geo-targeting in a country (used as the "state" parameter on the scrape tools). Only countries with state-level targeting are accepted.
  inputSchema:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    properties:
      country:
        description: ISO 3166-1 alpha-2 country code to list states for. Only countries with state-level targeting are supported.
        type: string
        enum:
        - US
    required:
    - country
  rest:
    operationId: getStates
    method: GET
    path: /v1/states
billing_note: Each scrape tool call is a sync request billed at the provider credit rate plus the +2 sync surcharge and counts against plan concurrency; the client timeout in the reference server is 320 seconds. Grok is registered but temporarily unavailable (provider has blocked anonymous access).
