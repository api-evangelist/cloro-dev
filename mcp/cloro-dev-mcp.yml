method: probed
status: live
source: https://mcp.cloro.dev/mcp (POST initialize + tools/list, 2026-10-07, unauthenticated, HTTP 200 text/event-stream); https://cloro.dev/docs/integrations/mcp; https://github.com/cloro-dev/mcp-server
name: cloro MCP server
description: cloro's hosted Model Context Protocol server. A thin wrapper over api.cloro.dev exposing the sync monitor endpoints as tools; each request forwards the caller's own credential so the API enforces authentication, credit billing, rate limiting and concurrency limits. Tool input schemas are the same schemas the API validates with.
server:
  name: cloro
  version: 0.2.0
  protocolVersion: '2025-06-18'
  capabilities:
    tools:
      listChanged: true
  transport: streamable-http
  source: initialize response from https://mcp.cloro.dev/mcp on 2026-10-07
deployment:
  mode: both
  endpoint: https://mcp.cloro.dev/mcp
  install: git clone https://github.com/cloro-dev/mcp-server && npm install && npm run build && MCP_TRANSPORT=stdio CLORO_API_KEY=your_key node dist/index.js
  package: https://github.com/cloro-dev/mcp-server
  auth: oauth
  verified: probed
  note: 'Remote: initialize and tools/list answered HTTP 200 without a credential on 2026-10-07 (serverInfo cloro 0.2.0, protocolVersion 2025-06-18); the docs state the first tools/call without a credential returns 401 with a WWW-Authenticate pointing at /.well-known/oauth-protected-resource/mcp. Local stdio: the open-source repository (package.json name @cloro/mcp-server 0.2.0, bin cloro-mcp) runs over stdio with MCP_TRANSPORT=stdio; it is NOT published to npm (registry.npmjs.org/@cloro/mcp-server returned 404 on 2026-10-07), so local use means cloning and building the repository. GET https://mcp.cloro.dev/mcp returns 405 "This server is stateless - send POST requests only".'
auth:
  modes:
  - oauth
  - api-key
  oauth:
    protected_resource_metadata: https://mcp.cloro.dev/.well-known/oauth-protected-resource
    authorization_servers:
    - https://clerk.cloro.dev
    authorization_server_metadata: https://clerk.cloro.dev/.well-known/oauth-authorization-server
    scopes_supported:
    - profile
    - email
    - user:org:read
    pkce: S256
    grant_types:
    - authorization_code
    - refresh_token
    - urn:ietf:params:oauth:grant-type:device_code
    note: 'Claude connector flow: add https://mcp.cloro.dev/mcp as a custom connector with "Sign in when needed"; Claude Code: claude mcp add --transport http cloro https://mcp.cloro.dev/mcp then /mcp to sign in.'
  api_key:
    header: 'Authorization: Bearer YOUR_CLORO_API_KEY'
    url_path_form: https://mcp.cloro.dev/YOUR_CLORO_API_KEY/mcp
    note: For clients that cannot set headers the key goes in the URL path (documented by the provider).
clients:
  claude: Customize -> Connectors -> Add custom connector -> https://mcp.cloro.dev/mcp
  claude_code: claude mcp add --transport http cloro https://mcp.cloro.dev/mcp
  cursor_and_others:
    mcpServers:
      cloro:
        type: http
        url: https://mcp.cloro.dev/YOUR_CLORO_API_KEY/mcp
tool_count: 10
tools:
- name: scrape_chatgpt
  title: Scrape ChatGPT
  description: 'Submit a prompt to ChatGPT from a chosen country (and optionally US state) and return the full answer: text, cited sources, and optionally markdown, search queries, shopping results, and ads. Use this to see how ChatGPT answers a prompt and which brands/sources it mentions.'
  inputSchema:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    properties:
      prompt:
        description: The prompt to submit to ChatGPT.
        type: string
        minLength: 1
        maxLength: 10000
      country:
        description: ISO 3166-1 alpha-2 country code to geo-target the request from (e.g. "US"). Use list_countries to see supported codes per model.
        type: string
      include:
        description: 'Optional flags for heavier payload fields, each off by default: markdown (the answer rendered as markdown), html (the answer page HTML), rawResponse (the engine''s unprocessed response payload), searchQueries (the web searches ChatGPT issued while answering), ads and shopping (sponsored and product results; these render only on the desktop UI, so pair them with legacy: true). Leave unset for the leanest response.'
        type: object
        properties:
          markdown:
            type: boolean
          rawResponse:
            type: boolean
          searchQueries:
            type: boolean
          html:
            type: boolean
          ads:
            type: boolean
          shopping:
            type: boolean
      legacy:
        description: Serve ChatGPT's desktop UI instead of the default mobile-web UI. Needed for include.ads and include.shopping, which only render on desktop. Defaults to false.
        type: boolean
      disableWebSearch:
        type: boolean
      state:
        description: Optional state code for state-level targeting (e.g. "CA" when country is "US"). Only some countries support this — call list_states for the supported countries and their codes.
        type: string
    required:
    - prompt
    - country
  rest:
    operationId: monitorChatgpt
    method: POST
    path: /v1/monitor/chatgpt
