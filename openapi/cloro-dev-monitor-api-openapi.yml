  /v1/monitor/google/goto:
    post:
      summary: Resolve a Google redirect link
      description: 'Resolve one Google redirect link to its destination URL. Send the `redirectLink` that ships beside every resolved link on a Google Search, Google News, or AI Mode response, and the response gives you the URL it points to.


        Charges no credits, does not use a concurrency slot, and counts against the per-second rate limit like any other call. Each request resolves one link, and Google gets at most 10 seconds to answer.'
      operationId: resolveGoogleGoto
      requestBody:
        description: The Google redirect link to resolve
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleGotoRequest'
        required: true
      responses:
        '200':
          description: The destination the redirect link points to
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            X-Latency-Ms:
              $ref: '#/components/headers/XLatencyMs'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleGotoResponse'
        '400':
          description: Bad Request - The url is missing, malformed, or is not a google.com /goto or /url link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '429':
          description: Too Many Requests
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            X-Latency-Ms:
              $ref: '#/components/headers/XLatencyMs'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '502':
          description: Bad Gateway - Google did not answer with a redirect, or the request to Google failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalServiceError'
      tags:
      - Monitor
    servers:
    - url: https://api.cloro.dev
      description: Production server
