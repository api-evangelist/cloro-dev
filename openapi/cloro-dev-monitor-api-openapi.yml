components:
  schemas:
    CopilotMonitorResponse:
      required:
      - success
      - result
      type: object
      properties:
        success:
          type: boolean
          example: true
        result:
          description: Copilot response data
          type: object
          properties:
            text:
              type: string
              description: Copilot's response text
              example: As an AI assistant, I can help you find great laptops for programming...
            html:
              type: string
              format: uri
              description: A URL to the full HTML of the response.
              example: https://cdn.cloro.dev/results/c45a5081-808d-4ed3-9c86-e4baf16c8ab8/page-1.html
            sources:
              type: array
              description: Array of sources referenced in the response
              items:
                type: object
                properties:
                  position:
                    type: number
                    description: The position index of the source in the response
                    example: 1
                  url:
                    type: string
                    description: The URL of the source
                    example: https://example.com/article
                  label:
                    type: string
                    description: The display label for the source
                    example: Microsoft Docs
                  description:
                    type: string
                    description: A description of the source content
                    example: Development hardware recommendations
              example:
              - position: 1
                url: https://docs.microsoft.com/
                label: Microsoft Docs
                description: Official development documentation
            citationPills:
              type: array
              description: 'Inline citation pills extracted from the Copilot answer. Each entry is one (pill, source) pair: when a pill cites N sources (consecutive citation events grouped into a single chip), the array contains N entries sharing the same `citationPillId` but carrying per-source `label`, `url`, and `domain`. Group by `citationPillId` to recover the pill-level structure. Omitted from `result` when the answer carries no pills.'
              items:
                type: object
                required:
                - label
                - citationPillId
                - url
                - domain
                - position
                properties:
                  label:
                    type: string
                    description: Per-source title from the citation event (e.g. `"Microsoft 365 Documentation"`, `"Productivity Best Practices"`). Always present; may be an empty string when the event ships no title — read `domain` / `url` for source identity in that case. Entries grouped under the same `citationPillId` carry different per-source labels.
                    example: Microsoft 365 Documentation
                  citationPillId:
                    type: integer
                    description: 1-based ordinal shared by all entries from the same chip. Group by `citationPillId` to reconstruct the visible chip; the per-source `label` differs across entries within a chip.
                    example: 1
                  url:
                    type: string
                    description: Direct URL of the cited source.
                    example: https://docs.microsoft.com/
                  domain:
                    type: string
                    description: Host extracted from `url`, for grouping and display.
                    example: docs.microsoft.com
                  description:
                    type: string
                    description: Source description from the sources rail when Copilot ships one. Omitted when absent.
                    example: Official development documentation
                  position:
                    type: integer
                    description: 1-based position of this source in the sibling `result.sources` array.
                    example: 1
              example:
              - label: Microsoft 365 Documentation
                citationPillId: 1
                url: https://docs.microsoft.com/
                domain: docs.microsoft.com
                description: Official development documentation
                position: 1
              - label: VS Code on GitHub
                citationPillId: 1
                url: https://github.com/microsoft/vscode
                domain: github.com
                description: Visual Studio Code repository
                position: 2
            shoppingCards:
              type: array
              description: Array of shopping/product cards extracted from the response (when available)
              items:
                type: object
                properties:
                  type:
                    type: string
                    description: Shopping card type
                    example: shoppingProducts
                  layout:
                    type: string
                    description: Layout style for the shopping card
                    example: Carousel
                  products:
                    type: array
                    description: Array of product information
                    items:
                      type: object
                      properties:
                        product:
                          type: object
                          description: Product identifier information
                          properties:
                            id:
                              type: string
                              description: Unique product ID
                            groupId:
                              type: string
                              description: Product group ID
                            brandGroupId:
                              type: string
                              description: Brand group ID (optional)
                        position:
                          type: integer
                          description: 1-indexed rank across all products in all shopping cards in the response (flat, not reset per card).
                          example: 1
                        offerId:
                          type: string
                          description: Unique offer identifier
                        url:
                          type: string
                          description: Product page URL
                        name:
                          type: string
                          description: Product name
                        description:
                          type: string
                          description: Product description
                        images:
                          type: array
                          description: Product images with titles and URLs
                          items:
                            type: object
                            properties:
                              title:
                                type: string
                                description: Image title
                              url:
                                type: string
                                description: Image URL
                        specifications:
                          type: array
                          description: Product specifications (e.g., Color, Size)
                          items:
                            type: object
                            properties:
                              displayName:
                                type: string
                                description: Specification name
                              values:
                                type: array
                                description: Available values
                                items:
                                  type: string
                        tags:
                          type: array
                          description: Product tags
                          items:
                            type: string
                        price:
                          type: object
                          description: Product pricing information
                          properties:
                            amount:
                              type: number
                              description: Price amount
                            currency:
                              type: string
                              description: Currency code (optional)
                            currencySymbol:
                              type: string
                              description: Currency symbol
                        discountPrice:
                          type:
                          - object
                          - 'null'
                          description: Discount price, same shape as `price`. May be null or absent.
                          properties:
                            amount:
                              type: number
                              description: Price amount
                            currency:
                              type: string
                              description: Currency code (optional)
                            currencySymbol:
                              type: string
                              description: Currency symbol
                        seller:
                          type: string
                          description: Seller name
                        sellerLogoUrl:
                          type: string
                          description: Seller logo URL
                        brandName:
                          type: string
                          description: Product brand name
                        rating:
                          type: object
                          description: Product rating information
                          properties:
                            value:
                              type: number
                              description: Rating value
                            count:
                              type: integer
                              description: Number of ratings
                            maxRating:
                              type:
                              - number
                              - 'null'
                              description: Maximum rating scale. May be null or absent.
                        canTrackPrice:
                          type: boolean
                          description: Whether price tracking is available
            map:
              type: array
              description: Array of business/place map entries extracted from the response (when available)
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: Business name
                    example: WonderWorks Pigeon Forge
                  position:
                    type: integer
                    description: Position in results (1-indexed)
                    example: 1
                  placeId:
                    type: string
                    description: Google Place ID
                    example: ChIJEYpTsk__W4gR2sQLGzOjE3o
                  location:
                    type: object
                    description: Business location
                    properties:
                      address:
                        type: string
                        description: Full street address
                        example: 100 Music Rd, Pigeon Forge, TN 37863
                      latitude:
                        type: number
                        description: GPS latitude
                        example: 35.823257
                      longitude:
                        type: number
                        description: GPS longitude
                        example: -83.5787498
                  phoneNumber:
                    type: string
                    description: Contact phone number
                    example: (865) 868-1800
                  url:
                    type: string
                    format: uri
                    description: Business website URL
                    example: http://www.wonderworksonline.com/pigeon-forge/
                  reviews:
                    type: array
                    description: Review aggregations from providers
                    items:
                      type: object
                      properties:
                        count:
                          type: integer
                          description: Number of reviews
                          example: 10625
                        rating:
                          type: number
                          description: Average rating
                          example: 4.3
                        providerName:
                          type: string
                          description: Review provider name
                          example: Google
                        providerIconUrl:
                          type: string
                          description: Provider icon URL
                        url:
                          type: string
                          format: uri
                          description: Reviews page URL
                          example: https://maps.google.com/?cid=8796553937077126362
                  photos:
                    type: array
                    description: Business photos
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          format: uri
                          description: Photo URL
                        altText:
                          type: string
                          description: Alt text for the photo
                        providerName:
                          type: string
                          description: Photo provider name
                        providerUrl:
                          type: string
                          format: uri
                          description: Photo provider URL
                  openState:
                    type: string
                    description: Current open/closed status
                    example: Open · Closes 9 PM
                  category:
                    type: string
                    description: Business category
                    example: Amusement park
                  price:
                    description: Price level (if available)
                  layerLabel:
                    type: string
                    description: Map layer grouping label
                    example: Theme Parks
                example:
                  name: WonderWorks Pigeon Forge
                  position: 1
                  placeId: ChIJEYpTsk__W4gR2sQLGzOjE3o
                  location:
                    address: 100 Music Rd, Pigeon Forge, TN 37863
                    latitude: 35.823257
                    longitude: -83.5787498
                  phoneNumber: (865) 868-1800
                  url: http://www.wonderworksonline.com/pigeon-forge/
                  reviews:
                  - count: 10625
                    rating: 4.3
                    providerName: Google
                    providerIconUrl: null
                    url: https://maps.google.com/?cid=8796553937077126362
                  photos:
                  - url: https://lh3.googleusercontent.com/gps-cs-s/example
                    altText: null
                    providerName: null
                    providerUrl: https://maps.google.com
                  openState: Open · Closes 9 PM
                  category: Amusement park
                  price: null
                  layerLabel: Theme Parks
            searchQueries:
              type: array
              description: Array of query fan-out — the web search queries Copilot ran while generating the response. Automatically included when at least one is available, no surcharge.
              items:
                type: string
              example:
              - best laptops for programming 2025
              - developer laptop reviews
            markdown:
              type: string
              description: Copilot's response formatted in Markdown (included when include.markdown is true)
              example: As an AI assistant, I can help you find great laptops for programming...
            rawResponse:
              type: array
              description: Raw upstream provider stream captured during the request. Each item is one chunk from the provider's wire protocol (SSE event, batchexecute frame, etc.). Format is provider-specific, undocumented, and may change without notice — use it for debugging or to access data not yet surfaced in the structured fields above.
              items: {}
    ProductResult:
      type: object
      description: One product cluster and its merchant offers. Only `title` is guaranteed; anything Google's panel lacks is omitted, never sent as `null`.
      required:
      - title
      properties:
        title:
          type: string
          description: Product cluster title, as Google displayed it. Empty when the page has no product heading.
          example: Apple iPhone 17
        stores:
          type: array
          description: Merchant offers. Always present on Google Search entries; omitted on AI Mode when Google lists none.
          items:
            type: object
            required:
            - name
            properties:
              name:
                type: string
                description: Merchant name
                example: Apple
              link:
                type: string
                format: uri
                description: Merchant product URL, passed through from Google verbatim
                example: https://www.apple.com/shop/buy-iphone/iphone-17
              redirectLink:
                type: string
                description: Google's `/goto` redirect for this link, in the absolute form `POST /v1/monitor/google/goto` accepts. Present only when Google served the link as a redirect — the sibling link field holds the destination cloro resolved it to.
                example: https://www.google.com/goto?url=CAESaAHrOzAVev0pi_wnTxm1qpiZTmMyAllabLr1or10ZCfvJKPk
              price:
                type: object
                description: Offer price. Omitted when the displayed text can't be parsed.
                required:
                - value
                - currency
                properties:
                  value:
                    type: number
                    description: Parsed numeric price. On installment offers, the monthly payment.
                    example: 799
                  currency:
                    type: string
                    description: ISO 4217 code, or the displayed token when it maps to none
                    example: USD
                  raw:
                    type: string
                    description: Visible price text verbatim
                    example: $799.00
              installments:
                type: string
                description: Installment terms as displayed
              description:
                type: string
                description: Merchant's listing title, naming the exact SKU sold
                example: iPhone 17 256GB White - Apple
              buyingOptions:
                type: array
                description: Merchant badges in display order, such as stock status, delivery promise and returns window
                items:
                  type: string
              logo:
                type: string
                format: uri
                description: Merchant logo URL
              shipping:
                type: string
                description: Shipping cost or promise as displayed
              condition:
                type: string
                description: Item condition
                example: New
              rating:
                type: number
                description: Merchant rating
              reviews:
                type: string
                description: Merchant review count, abbreviated
                example: 2.3k
        aboutTheProduct:
          type: object
          description: Google's description of the product
          properties:
            description:
              type: string
              description: Prose blurb
            features:
              type: array
              description: Feature bullets, when shown
              items:
                type: string
        specifications:
          type: object
          description: 'Spec tables: each category name maps to key/value pairs. Category names and keys arrive in the response language.'
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          example:
            general:
              Brand: Apple
              Storage: 256 GB
        images:
          type: array
          items:
            type: object
            required:
            - mainUrl
            properties:
              mainUrl:
                type: string
                format: uri
              thumbnailUrl:
                type: string
                format: uri
              title:
                type: string
        rating:
          type: number
          description: Product rating
        reviews:
          type: string
          description: Product review count
        variants:
          type: array
          description: Product variants Google offers
          items:
            type: object
        userReviews:
          type: array
          description: User reviews
          items:
            type: object
        relatedProducts:
          type: array
          description: Related products
          items:
            type: object
    PlaceItem:
      type: object
      description: General place or location information
      properties:
        name:
          type: string
          description: Place name
          example: Floresta Das Escadinhas
        url:
          type: string
          description: Place page URL
          example: https://www.tripadvisor.com/Restaurant_Review-g189158-d1520116-Reviews-Floresta_Das_Escadinhas-Lisbon_District_Central_Portugal.html
        rating:
          type: number
          description: Place rating (0-5)
          example: 4.8
        address:
          type: array
          description: Address lines
          items:
            type: string
          example:
          - Rua de Santa Justa N°3, Lisbon 1100-483 Portugal
        lat:
          type: number
          description: Latitude
          example: 38.712717
        lng:
          type: number
          description: Longitude
          example: -9.136362
        categories:
          type: array
          description: Place categories
          items:
            type: string
          example:
          - Healthy
          - Grill
          - Barbecue
          - Mediterranean
          - Portuguese
          - European
        map_url:
          type: string
          description: Map URL
          example: https://google.com/maps/?q=find+best+hotels+and+restaurants+in+lisbon&ll=38.720914,-9.147162&z=15
        images:
          type: array
          description: Place image URLs
          items:
            type: string
    ChatGPTMonitorRequest:
      required:
      - prompt
      - country
      type: object
      properties:
        prompt:
          description: The prompt to send to ChatGPT
          type: string
          minLength: 1
          maxLength: 10000
          example: What do you know about Acme Corp?
        country:
          $ref: '#/components/schemas/CountryCode'
          description: Country/region code for localized response, using ISO 3166-1 alpha-2 country codes.
        include:
          description: Optional flags for including additional response formats
          type: object
          default:
            html: false
            markdown: false
            rawResponse: false
            searchQueries: false
            ads: false
            shopping: false
          properties:
            html:
              description: Include a URL to the full HTML of the response
              type: boolean
              default: false
              example: true
            markdown:
              description: Include markdown-formatted response in the result
              type: boolean
              default: false
              example: true
            rawResponse:
              description: 'Include ChatGPT''s raw response payload. Paid add-on: one flat +2 credits covers any combination of `rawResponse`, `searchQueries`, `ads` and `shopping` ([pricing](/guides/providers#chatgpt-additional-features)).'
              type: boolean
              default: false
              example: true
            searchQueries:
              description: 'Include the query fan-out ChatGPT used to generate the response. Paid add-on: one flat +2 credits covers any combination of `rawResponse`, `searchQueries`, `ads` and `shopping` ([pricing](/guides/providers#chatgpt-additional-features)).'
              type: boolean
              default: false
              example: true
            ads:
              description: 'Include ads displayed in ChatGPT response. Paid add-on: one flat +2 credits covers any combination of `rawResponse`, `searchQueries`, `ads` and `shopping` ([pricing](/guides/providers#chatgpt-additional-features)).'
              type: boolean
              default: false
              example: true
            shopping:
              description: 'Include shopping cards and inline products with pricing and offers. Paid add-on: one flat +2 credits covers any combination of `rawResponse`, `searchQueries`, `ads` and `shopping` ([pricing](/guides/providers#chatgpt-additional-features)).'
              type: boolean
              default: false
              example: true
          required: []
          example:
            html: true
            markdown: true
            rawResponse: true
            searchQueries: true
            ads: true
            shopping: true
          additionalProperties: false
        legacy:
          description: 'Serve ChatGPT''s legacy desktop interface instead of the default mobile-web one. The legacy interface streams the answer as an event stream, so `result.model`, `result.searchQueries` and `result.mapSearchQueries` are populated. Best-effort and temporary: OpenAI controls which interface it serves and can retire the legacy one at any time, so a request can still come back in the mobile-web shape. Handle both. Defaults to false.'
          type: boolean
          default: false
          example: true
        disableWebSearch:
          description: 'Do not force ChatGPT''s web search. cloro returns the answer ChatGPT gives on its own, which uses web search only when ChatGPT decides to, so `result.sources`, `result.citationPills` and `result.searchQueries` are often empty. Defaults to false: web search is forced on every request.'
          type: boolean
          default: false
          example: true
        state:
          $ref: '#/components/schemas/StateParameter'
      additionalProperties: false
    HlParameter:
      description: Interface language, as Google's own `hl` parameter (e.g. `en`, `de`, `pt-BR`). Free-form and case-insensitive — Google owns the list of codes. Overrides the language cloro derives from the country, so the interface language and the result geography can differ.
      type: string
      example: en
    MediaItem:
      type: object
      description: Media content (video or image) found in response
      properties:
        title:
          type: string
          description: Media title
          example: Best hotels in Lisbon, reviewed | The Independent
        url:
          type: string
          description: Media URL
          example: https://www.independent.co.uk/travel/europe/portugal/lisbon/best-lisbon-portugal-hotels-b1987832.html
        thumbnail:
          type: string
          description: Thumbnail URL
          example: https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/636fbd12-6dee-5f44-a76d-fe7f9cd20e40/75ce41cb-6767-5082-a330-ee97c5866886.jpg
        medium:
          type: string
          description: Media type as Perplexity labels it, for example `video` or `image`
          example: image
        source:
          type: string
          description: Source platform
          example: web
        image_width:
          type: number
          description: Original image width
          example: 5600
        image_height:
          type: number
          description: Original image height
          example: 3733
        thumbnail_width:
          type: number
          description: Thumbnail width
          example: 300
        thumbnail_height:
          type: number
          description: Thumbnail height
          example: 200
    GrokMonitorRequest:
      required:
      - prompt
      - country
      type: object
      properties:
        prompt:
          description: The prompt to send to Grok
          type: string
          minLength: 1
          maxLength: 10000
          example: What are the best laptops for programming?
        country:
          $ref: '#/components/schemas/CountryCode'
          description: Country/region code for localized response, using ISO 3166-1 alpha-2 country codes.
        include:
          description: Optional flags for including additional response formats
          type: object
          properties:
            markdown:
              description: Include markdown-formatted response in the result
              type: boolean
              default: false
              example: true
            html:
              description: Include HTML-formatted response in the result
              type: boolean
              default: false
              example: true
            rawResponse:
              description: Include raw streaming response events
              type: boolean
              default: false
              example: true
          default:
            markdown: false
            html: false
            rawResponse: false
          additionalProperties: false
        state:
          $ref: '#/components/schemas/StateParameter'
      additionalProperties: false
    GlParameter:
      description: Alternative to `country`, using Google's own parameter name for the result geography. Same ISO 3166-1 alpha-2 codes, accepted in either case (`us` or `US`), and must be a country the endpoint supports — see `GET /v1/countries`. Provide `country` or `gl`; sending both with different values is a `400`.
      type: string
      example: us
    GoogleNewsMonitorRequest:
      required:
      - query
      type: object
      properties:
        query:
          description: The search query to execute on Google News
          type: string
          minLength: 1
          maxLength: 10000
          example: climate change
        country:
          $ref: '#/components/schemas/CountryCode'
          description: ISO 3166-1 alpha-2 country code for localized news results. See [List of countries](/api-reference/endpoint/countries) for the codes each provider supports.
        gl:
          $ref: '#/components/schemas/GlParameter'
