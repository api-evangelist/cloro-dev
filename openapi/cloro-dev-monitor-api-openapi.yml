                                example: adidas
                              marketplace_seller:
                                type:
                                - string
                                - 'null'
                                description: Third-party seller on the marketplace
                              seller_name:
                                type: string
                                description: Seller name
                              brand:
                                type:
                                - string
                                - 'null'
                                description: Product brand. Set on only some offers, so often `null` or absent.
                              product_name:
                                type: string
                                description: Product name as listed by merchant
                                example: Adidas Women's VL Court 3.0
                              url:
                                type: string
                                description: Offer URL with ChatGPT attribution
                                example: https://www.adidas.com/us/vl-court-3.0-shoes/ID8797.html?utm_source=chatgpt.com
                              price:
                                type: string
                                description: Offer price
                                example: $57.00
