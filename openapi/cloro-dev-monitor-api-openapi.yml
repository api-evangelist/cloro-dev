              items: {}
    GoogleMonitorRequest:
      anyOf:
      - required:
        - query
        - country
      - required:
        - query
        - gl
      - required:
        - url
      type: object
      properties:
        query:
          description: The search query to execute on Google. Required unless you supply 'url' instead — the two are mutually exclusive.
          type: string
          minLength: 1
          maxLength: 10000
          example: best laptops for programming
        url:
          description: A complete Google web search URL to run instead of building the request from 'query' and the targeting fields. Must be an absolute http(s) URL on a Google web search host (google.com, google.co.uk, www.google.de, ...), with the path '/search' and a non-empty 'q'. Mutually exclusive with 'query', 'location', 'uule' and 'pages' — the URL owns those values. cloro applies a fixed set of query parameters — 'q', 'gl', 'hl', 'uule', 'num' (read as result depth), 'start', 'tbs' and 'safe' — and drops anything else. URLs carrying 'tbm' are rejected, because they target a Google vertical with its own endpoint and pricing (use POST /v1/monitor/google/news for tbm=nws).
          type: string
          format: uri
          example: https://www.google.com/search?q=best+laptops+for+programming&hl=en&gl=us&num=30
        country:
          $ref: '#/components/schemas/CountryCode'
          description: ISO 3166-1 alpha-2 country code for localized search results. See [List of countries](/api-reference/endpoint/countries) for the codes each provider supports. Required in the standard request shape unless you send `gl`. When you supply 'url' instead, country is derived from the URL's 'gl' — pass it explicitly to override that, or when the URL has no 'gl'.
        gl:
          $ref: '#/components/schemas/GlParameter'
        hl:
          $ref: '#/components/schemas/HlParameter'
        location:
          description: 'Google canonical location name for geo-targeted results, in comma-separated format: ''City,Region,Country'' (see https://developers.google.com/google-ads/api/reference/data/geotargets for all ~100,000 supported locations). Use alongside ''country'' for city-level precision. Mutually exclusive with ''uule'' — provide one or the other, not both. Cannot be combined with ''url''. When both `location` and `uule` are omitted, cloro pins results to the country''s canonical location (e.g. `Portugal` for `PT`) where it has one; otherwise Google geolocates from the proxy''s exit IP.'
          type: string
          example: New York,New York,United States
        uule:
          description: Pre-encoded Google UULE string for precise geo-targeting. Use this when you have a pre-built UULE value instead of a location name. Mutually exclusive with 'location' — provide one or the other, not both. Cannot be combined with 'url'; put 'uule' in the URL's query string instead.
          type: string
          example: w+CAIQICIeV2VzdCBOZXcgWW9yayxOZXcgSmVyc2V5
        device:
          description: Device the search is run from. 'desktop' returns the desktop SERP; 'ios' (Safari on iPhone), 'android' (Chrome on Android) and 'mobile' (alias for 'android') all return the mobile SERP.
          type: string
          enum:
          - desktop
          - mobile
          - ios
          - android
          default: desktop
          example: desktop
        pages:
          description: 'Number of search results pages to scrape (1-10). Paid add-on: +2 credits per page after the first ([pricing](/guides/providers#google-search-multi-page-pricing)). Cannot be combined with ''url'' — in that shape, depth comes from the URL''s ''num'' (rounded up to whole pages of 10, capped at 10 pages).'
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          example: 3
        include:
          description: Optional flags for including additional response data
          type: object
          properties:
            html:
              description: Include raw HTML response from Google search
              type: boolean
              default: false
              example: false
            aioverview:
              description: 'Include Google AI Overview in the response. Paid add-on: one flat +2 credits covers `aioverview` and `paaAioverview`, alone or together ([pricing](/guides/providers#google-search-multi-page-pricing)).'
              type: object
              properties:
                markdown:
                  description: Include AI Overview formatted as markdown
                  type: boolean
                  default: false
                  example: true
              default:
                markdown: false
              additionalProperties: false
            paaAioverview:
              description: 'Hydrate AI-Overview-type People Also Ask items with markdown content and sources. Paid add-on: one flat +2 credits covers `aioverview` and `paaAioverview`, alone or together ([pricing](/guides/providers#google-search-multi-page-pricing)). Each hydrated item adds one scraper fetch (typically 1-2 per page), so responses take longer.'
              type: boolean
              default: false
              example: true
            googleGoto:
              description: Ignored since 8th September 2026. Every redirect link now ships as `redirectLink` beside its destination, so both are returned without this flag. Requests still sending it behave as if it were absent.
              type: boolean
              default: false
              example: true
              deprecated: true
          default:
            html: false
          additionalProperties: false
      additionalProperties: false
    ChatGPTMonitorResponse:
      required:
      - success
      - result
      type: object
      properties:
        success:
          type: boolean
          example: true
        result:
          description: ChatGPT's response data
          type: object
          properties:
            text:
              type: string
              description: ChatGPT's response text
              example: 'The name "Acme Corporation" is used in various contexts, both fictional and real. Here''s an overview:


                🐾 Acme Corporation in Fiction

                The Acme Corporation is a fictional company featured prominently in Warner Bros. cartoons, particularly the Road Runner/Wile E. Coyote series.'
            sources:
              type: array
              description: Array of sources referenced in the response. Returns empty array when no sources are available.
              items:
                type: object
                properties:
                  position:
                    type: number
                    description: The position index of the source in the response
                    example: 1
                  url:
                    type: string
                    description: The URL of the source
                    example: https://www.rippling.com/blog/ai-recruiting?utm_source=chatgpt.com
                  label:
                    type: string
                    description: The article title of the source
                    example: 12 Best AI Recruiting Tools For HR in 2025
