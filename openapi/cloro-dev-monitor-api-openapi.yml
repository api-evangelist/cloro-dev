    AiModeMonitorRequest:
      required:
      - prompt
      type: object
      properties:
        prompt:
          description: The prompt to send to AI Mode
          type: string
          minLength: 1
          maxLength: 10000
          example: What are the best laptops for programming?
        country:
          $ref: '#/components/schemas/CountryCode'
          description: Country/region code for localized response, using ISO 3166-1 alpha-2 country codes.
        gl:
          $ref: '#/components/schemas/GlParameter'
        hl:
          $ref: '#/components/schemas/HlParameter'
        location:
          description: 'Google canonical location name for geo-targeted results, in comma-separated format: ''City,Region,Country'' (see https://developers.google.com/google-ads/api/reference/data/geotargets for all ~100,000 supported locations). Use alongside ''country'' for city-level precision. Mutually exclusive with ''uule'' — provide one or the other, not both. When both `location` and `uule` are omitted, cloro pins results to the country''s canonical location (e.g. `Portugal` for `PT`) where it has one; otherwise Google geolocates from the proxy''s exit IP.'
          type: string
          example: New York,New York,United States
        uule:
          description: Pre-encoded Google UULE string for precise geo-targeting. Use this when you have a pre-built UULE value instead of a location name. Mutually exclusive with 'location' — provide one or the other, not both.
          type: string
          example: w+CAIQICIeV2VzdCBOZXcgWW9yayxOZXcgSmVyc2V5
        device:
          description: Device type for search results
          type: string
          enum:
          - desktop
          - mobile
          default: desktop
          example: desktop
        include:
          description: Optional flags for including additional response formats
          type: object
          properties:
            html:
              description: Include a URL to the full HTML of the response
              type: boolean
              default: false
              example: true
            markdown:
              description: Include markdown-formatted response in the result
              type: boolean
              default: false
              example: true
            expandProducts:
              description: 'Fetch merchant offers for the product clusters in the response and return them as ''result.productResults''. Clusters are deduplicated across shopping cards and inline products, and expansion covers at most 6 per scrape. Paid add-on: +1 credit per cluster returned, up to +6 ([pricing](/guides/providers#ai-mode-additional-features)). Off by default.'
              type: boolean
              default: false
              example: true
            googleGoto:
              description: Ignored since 8th September 2026. Every redirect link now ships as `redirectLink` beside its destination, so both are returned without this flag. Requests still sending it behave as if it were absent.
              type: boolean
              default: false
              example: true
              deprecated: true
          default:
            html: false
            markdown: false
            expandProducts: false
          additionalProperties: false
      additionalProperties: false
      anyOf:
      - required:
        - country
      - required:
        - gl
