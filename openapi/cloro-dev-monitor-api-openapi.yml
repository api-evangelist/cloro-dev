                $ref: '#/components/schemas/HotelItem'
            places:
              type: array
              description: General places and locations
              items:
                $ref: '#/components/schemas/PlaceItem'
            shopping_cards:
              type: array
              description: Shopping product cards with detailed product information (when shopping intent detected)
              items:
                type: object
                properties:
                  tags:
                    type: array
                    description: Optional category tags for the shopping card
                    items:
                      type: string
                    example:
                    - running
                    - athletic
                  products:
                    type: array
                    description: Array of product objects
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          description: Product name
                          example: Nike Pegasus 41
                        id:
                          type: string
                          description: Product identifier
                          example: nike-pegasus-41
                        url:
                          type: string
                          description: Product page URL
                          example: https://www.nike.com/t/pegasus-41
                        price:
                          type: string
                          description: Current price
                          example: $140.00
                        merchant:
                          type: string
                          description: Merchant name
                          example: Nike
                        available:
                          type: boolean
                          description: Whether the product is currently available
                          example: true
                        imageUrls:
                          type: array
                          description: Product image URLs
                          items:
                            type: string
                        numReviews:
                          type: number
                          description: Number of reviews (0 when none)
                          example: 1284
                        offers:
                          type: array
                          description: Shopping offers from individual merchants
                          items:
                            type: object
                            properties:
                              url:
                                type: string
                                description: Offer URL with Perplexity referral parameters
                              price:
                                type: string
                                description: Offer price
                                example: $140.00
                              merchant_name:
                                type: string
                                description: Merchant name
                                example: Nike
                              product_name:
                                type: string
                                description: Product name as listed by the merchant
                                example: Nike Pegasus 41 Running Shoes
                              available:
                                type: boolean
                                description: Whether the offer is in stock
                                example: true
                              price_details:
                                type: object
                                description: Detailed price breakdown
                                properties:
                                  display_price:
                                    type: string
                                    description: Formatted display price
                                    example: $140.00
                              original_price:
                                type: string
                                nullable: true
                                description: Original price before discount; null when not on sale
                                example: null
                        position:
                          type: integer
                          description: 1-indexed rank across all products in all shopping cards in the response (flat, not reset per card)
                          example: 1
                        rating:
                          type: number
                          description: Product rating (0-5 scale)
                          example: 4.6
                        original_price:
                          type: string
                          nullable: true
                          description: Original price before discount; null when not on sale
                        description:
                          type: string
                          description: Product description
                          example: Responsive cushioning for daily training runs.
                        variants:
                          type: array
                          description: Product variants (size, color, etc.)
                          items:
                            type: object
            search_model_queries:
              type: array
              description: Internal search queries used to generate response
              items:
                type: string
                example: find best hotels and restaurants in lisbon
            rawResponse:
              type: array
              description: Raw upstream provider stream captured during the request. Each item is one chunk from the provider's wire protocol (SSE event, batchexecute frame, etc.). Format is provider-specific, undocumented, and may change without notice — use it for debugging or to access data not yet surfaced in the structured fields above.
              items: {}
    GeminiMonitorResponse:
      required:
      - success
      - result
      type: object
      properties:
        success:
          type: boolean
          example: true
        result:
          description: Gemini response data
          type: object
          properties:
            text:
              type: string
              description: Gemini's response text
              example: Quantum computing is a type of computation...
            markdown:
              type: string
              description: Gemini's response in Markdown format
              example: '**Quantum computing** is a type of computation...'
            html:
              type: string
              description: A URL to the full HTML of the response. Expires 24 hours after generation.
              example: https://cdn.cloro.dev/results/c45a5081-808d-4ed3-9c86-e4baf16c8ab8/page-1.html
            sources:
              type: array
              description: Sources cited by Gemini
              items:
                type: object
                properties:
                  position:
                    type: integer
                    description: Position of the source in the list
                    example: 1
                  label:
                    type: string
                    description: Label or title of the source
                    example: Wikipedia - Quantum Computing
                  url:
                    type: string
                    description: URL of the source
                    example: https://en.wikipedia.org/wiki/Quantum_computing
                  description:
                    type: string
                    description: Description or snippet of the source
                    example: Quantum computing is a multidisciplinary field...
            citationPills:
              type: array
              description: 'Inline citation pills extracted from the Gemini answer. Each entry is one (pill, source) pair: when a chip cites N sources (Gemini''s `+N` analog or section-summary chips), the array contains N entries sharing the same `citationPillId` but with per-source `label`, `url`, and `domain`. Group by `citationPillId` to recover the pill-level structure. `label` is always present on the wire; it can be an empty string when the rail has no title for a source. Omitted from `result` when the answer carries no pills.'
              items:
                type: object
                required:
                - label
                - citationPillId
                - url
                - domain
                - position
                properties:
                  label:
                    type: string
                    description: Per-source title from the sources rail (for example `"Quantum computing — Wikipedia"`). Always present on the wire; may be an empty string when the rail has no title for this source — consumers should read `domain` / `url` for source identity in that case.
                    example: Quantum computing — Wikipedia
                  citationPillId:
                    type: integer
                    description: 1-based ordinal shared by all entries from the same chip. Group by `citationPillId` to reconstruct the visible chip; the per-source `label` differs across entries within a chip.
                    example: 1
                  url:
                    type: string
                    description: Direct URL of the cited source.
                    example: https://en.wikipedia.org/wiki/Quantum_computing
                  domain:
                    type: string
                    description: Host extracted from `url`, for grouping and display.
                    example: en.wikipedia.org
                  description:
                    type: string
                    description: Source description from the sources rail when Gemini ships one. Omitted when absent.
                    example: Quantum computing is a multidisciplinary field...
                  position:
                    type: integer
                    description: 1-based position of this source in the sibling `result.sources` array.
                    example: 1
              example:
              - label: Quantum computing — Wikipedia
                citationPillId: 1
                url: https://en.wikipedia.org/wiki/Quantum_computing
                domain: en.wikipedia.org
                description: Quantum computing is a multidisciplinary field...
                position: 1
              - label: IBM Quantum
                citationPillId: 1
                url: https://www.ibm.com/quantum
                domain: ibm.com
                position: 3
            places:
              type: array
              description: Place cards returned for lodging and local answers
              items:
                type: object
                required:
                - index
                - title
                - link
                properties:
                  index:
                    type: integer
                    description: Position index of the place in the results
                    example: 0
                  title:
                    type: string
                    description: Place name
                    example: Pullman Quay Grand Sydney Harbour
                  link:
                    type: string
                    format: uri
                    description: Google URL for the place
                    example: https://www.google.com/travel/search?q=Pullman+Quay+Grand+Sydney+Harbour
                  thumbnail:
                    type: string
                    format: uri
                    description: Place photo URL
                    example: https://lh3.googleusercontent.com/gps-cs-s/example
                  rating:
                    type: number
                    description: Star rating (0-5)
                    example: 4.4
                  reviews:
                    type: integer
                    description: Number of reviews
                    example: 1307
                  type:
                    type: string
                    description: Place type or category
                    example: 5-star hotel
                  description:
                    type: string
                    description: Short description of the place
                    example: Upscale hotel offering sophisticated suites, plus a restaurant, an indoor pool & a chic bar.
                  price:
                    type: string
                    description: Nightly price as Gemini displays it
                    example: $565
            shoppingCards:
              type: array
              description: Product cards Gemini shows on shopping answers, in display order. Field names follow AI Mode's `shoppingCards`. Omitted from `result` when the answer carries no product cards.
              items:
                type: object
                required:
                - position
                - title
                - productLink
                - productId
                properties:
                  position:
                    type: integer
                    description: 1-indexed rank across the `shoppingCards` array, in display order
                    example: 1
                  title:
                    type: string
                    description: Product title
                    example: ASICS Men's Novablast 5
                  productLink:
                    type: string
                    format: uri
                    description: Google Shopping URL for the product
                    example: https://google.com/search?q=ASICS+Men%27s+Novablast+5&prds=catalogid%3A15000182008314641842%2Cproductid%3A11413473167792520357&ibp=oshop
                  productId:
                    type: string
                    description: Google Shopping product ID
                    example: '11413473167792520357'
                  price:
                    type: object
                    description: Current price. For a range, `value` is the lowest price. For an installment offer, only `raw` is present
                    properties:
                      value:
                        type: number
                        description: Numeric price. Absent for an installment offer
                        example: 129.95
                      currency:
                        type: string
                        description: Currency symbol or code as displayed. Absent for an installment offer
                        example: $
                      raw:
                        type: string
                        description: Price text as Gemini displays it
                        example: $129.95
                  oldPrice:
                    type: object
                    description: Price before a discount, same shape as `price`. Absent when there is no discount
                    properties:
                      value:
                        type: number
                        description: Numeric price
                        example: 149.99
                      currency:
                        type: string
                        description: Currency symbol or code as displayed
                        example: $
                      raw:
                        type: string
                        description: Price text as Gemini displays it
                        example: $149.99
                  store:
                    type: string
                    description: Store that sells the product at `price`
                    example: Marathon Sports
                  storeLink:
                    type: string
                    format: uri
                    description: Direct URL of the product on the store's site
                    example: https://www.marathonsports.com/products/asics-mens-novablast-5
                  storeCount:
                    type: integer
                    description: Number of stores that sell the product. Gemini shows "& more" after the store name when it is above 1
                    example: 2
                  shipping:
                    type: string
                    description: Shipping cost as Gemini displays it
                    example: Free
                  deliveryTime:
                    type: string
                    description: Delivery time as Gemini displays it
                    example: Up to 5 days
                  rating:
                    type: number
                    description: Product rating (0-5). Absent for a product with no reviews
                    example: 4.8
                  reviews:
                    type: integer
                    description: Number of reviews
                    example: 11558
                  brand:
                    type: string
                    description: Product brand
                    example: ASICS
                  description:
                    type: string
                    description: Product description
                    example: The ASICS Novablast is a multi-talented running shoe...
                  thumbnail:
                    type: string
                    format: uri
                    description: Image URL that the card shows
                    example: https://encrypted-tbn1.gstatic.com/shopping?q=tbn:example
                  images:
                    type: array
                    description: All product image URLs. The first one is `thumbnail`
                    items:
                      type: string
                      format: uri
                    example:
                    - https://encrypted-tbn1.gstatic.com/shopping?q=tbn:example
                  catalogId:
                    type: string
                    description: Google Shopping catalog ID
                    example: '15000182008314641842'
                  gpcId:
                    type: string
                    description: Google Shopping product cluster ID
                    example: '1340101364570861215'
            rawResponse:
              type: array
              description: Raw upstream provider stream captured during the request. Each item is one chunk from the provider's wire protocol (SSE event, batchexecute frame, etc.). Format is provider-specific, undocumented, and may change without notice — use it for debugging or to access data not yet surfaced in the structured fields above.
              items: {}
